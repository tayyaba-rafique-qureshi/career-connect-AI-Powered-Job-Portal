name: CareerConnect CI

on:
  push:
    branches: [main, integration-manager]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Backend (Node.js) Tests ─────────────────────────────────────────
  backend-tests:
    name: Backend Tests (Node.js)
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JWT_SECRET: test_jwt_secret_for_ci
      AI_SERVICE_URL: http://localhost:8000
      CLIENT_URL: http://localhost:3001
      GMAIL_USER: test@test.com
      GMAIL_APP_PASSWORD: testpassword
      MAIL_FROM: CareerConnect <test@test.com>
      GOOGLE_CLIENT_ID: test_client_id
      GOOGLE_CLIENT_SECRET: test_client_secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Run utility tests (no DB needed)
        run: npx jest tests/utils.test.js --runInBand --forceExit
        working-directory: server

      - name: Run auth & jobs tests (requires MongoDB)
        if: ${{ env.MONGODB_URI != '' }}
        run: npx jest tests/auth.test.js tests/jobs.test.js --runInBand --forceExit --testTimeout=30000
        working-directory: server

  # ── Job 2: Frontend (React/Vite) Tests ─────────────────────────────────────
  frontend-tests:
    name: Frontend Tests (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        # Use npm install (not npm ci) so npm resolves the correct platform-specific
        # native bindings for Rolldown/Vitest on Linux (package-lock was generated on Windows).
        run: npm install
        working-directory: client

      - name: Run unit tests
        run: npm test
        working-directory: client

      - name: Build check
        run: npm run build
        working-directory: client
        env:
          VITE_API_BASE_URL: /api

  # ── Job 3: AI Service (Python) Tests ───────────────────────────────────────
  ai-tests:
    name: AI Service Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx
        working-directory: ai-service

      - name: Run AI service tests
        run: python -m pytest tests/ -v --tb=short
        working-directory: ai-service

  # ── Job 4: Integration summary ─────────────────────────────────────────────
  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, ai-tests]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-tests.result }}" == "failure" || \
                "${{ needs.frontend-tests.result }}" == "failure" || \
                "${{ needs.ai-tests.result }}" == "failure" ]]; then
            echo "FAILED: One or more test jobs failed"
            exit 1
          fi
          echo "PASSED: All tests passed"

  # ── Job 5: Selenium E2E Tests (Regression Suite) ──────────────────────────
  selenium-e2e-tests:
    name: Selenium E2E + Regression Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: success()

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JWT_SECRET: test_jwt_secret_for_ci
      AI_SERVICE_URL: http://localhost:8000
      CLIENT_URL: http://localhost:5173
      GMAIL_USER: test@test.com
      GMAIL_APP_PASSWORD: testpassword
      MAIL_FROM: CareerConnect <test@test.com>
      GOOGLE_CLIENT_ID: test_client_id
      GOOGLE_CLIENT_SECRET: test_client_secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Start Backend ──────────────────────────────────────────────────
      - name: Setup Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: server

      - name: Start backend server
        run: npm start &
        working-directory: server
        env:
          PORT: 5000

      # ── Start Frontend ─────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci
        working-directory: client

      - name: Build frontend for preview
        run: npm run build
        working-directory: client
        env:
          VITE_API_BASE_URL: http://localhost:5000/api

      - name: Start frontend preview server
        run: npm run preview -- --port 5173 &
        working-directory: client

      # ── Wait for services ──────────────────────────────────────────────
      - name: Wait for services to be ready
        run: |
          echo "Waiting for backend (port 5000)..."
          timeout 60 bash -c 'until curl -sf http://localhost:5000/api/health; do sleep 2; done'
          echo "Waiting for frontend (port 5173)..."
          timeout 60 bash -c 'until curl -sf http://localhost:5173; do sleep 2; done'
          echo "All services ready!"

      # ── Seed Admin User ────────────────────────────────────────────────
      - name: Seed admin user
        run: node src/scripts/createAdmin.js
        working-directory: server
        continue-on-error: true

      # ── Setup Python and Selenium ──────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tests/selenium/requirements.txt

      - name: Install Selenium dependencies
        run: pip install -r requirements.txt
        working-directory: tests/selenium

      # ── Install Chrome ─────────────────────────────────────────────────
      - name: Setup Chrome for Selenium
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      # ── Run Smoke Tests ────────────────────────────────────────────────
      - name: Run smoke tests
        run: |
          python -m pytest tests/selenium/tests/ -m "smoke" \
            -v --tb=short \
            --html=tests/selenium/reports/smoke_report.html \
            --self-contained-html \
            --timeout=30
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:5000/api
          ADMIN_EMAIL: admin@careerconnect.com
          ADMIN_PASSWORD: Admin@123
          HEADLESS: "true"
          BROWSER: chrome
          SCREENSHOT_ON_FAIL: "true"
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        continue-on-error: false

      # ── Run Regression Tests ───────────────────────────────────────────
      - name: Run regression tests
        run: |
          python -m pytest tests/selenium/tests/ -m "regression" \
            -v --tb=short \
            --html=tests/selenium/reports/regression_report.html \
            --self-contained-html \
            --timeout=60 \
            --reruns=2 \
            --reruns-delay=2
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:5000/api
          ADMIN_EMAIL: admin@careerconnect.com
          ADMIN_PASSWORD: Admin@123
          HEADLESS: "true"
          BROWSER: chrome
          SCREENSHOT_ON_FAIL: "true"
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        continue-on-error: true

      # ── Run CRUD Tests ─────────────────────────────────────────────────
      - name: Run CRUD tests
        run: |
          python -m pytest tests/selenium/tests/ -m "crud" \
            -v --tb=short \
            --html=tests/selenium/reports/crud_report.html \
            --self-contained-html \
            --timeout=60 \
            --reruns=1
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:5000/api
          ADMIN_EMAIL: admin@careerconnect.com
          ADMIN_PASSWORD: Admin@123
          HEADLESS: "true"
          BROWSER: chrome
          SCREENSHOT_ON_FAIL: "true"
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        continue-on-error: true

      # ── Upload Reports ─────────────────────────────────────────────────
      - name: Upload Selenium test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-reports-${{ github.run_number }}
          path: |
            tests/selenium/reports/*.html
            tests/selenium/reports/screenshots/
          retention-days: 14

      # ── Notify on Failure ──────────────────────────────────────────────
      - name: Summarize test results
        if: always()
        run: |
          echo "## Selenium Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression Tests | See artifacts |" >> $GITHUB_STEP_SUMMARY
          echo "| CRUD Tests | See artifacts |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 Download full HTML reports from the Artifacts section above." >> $GITHUB_STEP_SUMMARY

  # ── Job 6: Deploy to Staging (only on main branch after all tests pass) ─────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [selenium-e2e-tests, all-tests-passed]
    if: github.ref == 'refs/heads/main' && success()
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify deployment start
        run: |
          echo "🚀 All tests passed on main branch."
          echo "Deploying to staging environment..."
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"

      # Add your actual deployment step here, e.g.:
      # - name: Deploy to Railway / Render / EC2
      #   run: ./scripts/deploy.sh staging

      - name: Deployment complete
        run: echo "Staging deployment complete - https://staging.careerconnect.app"

  # ── Job 7: Updated final gate ──────────────────────────────────────────────
  all-checks-passed:
    name: All Checks Passed (including E2E)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, ai-tests, selenium-e2e-tests]
    if: always()

    steps:
      - name: Evaluate all job results
        run: |
          echo "backend-tests:     ${{ needs.backend-tests.result }}"
          echo "frontend-tests:    ${{ needs.frontend-tests.result }}"
          echo "ai-tests:          ${{ needs.ai-tests.result }}"
          echo "selenium-e2e:      ${{ needs.selenium-e2e-tests.result }}"

          if [[ "${{ needs.backend-tests.result }}" == "failure" || \
                "${{ needs.frontend-tests.result }}" == "failure" || \
                "${{ needs.ai-tests.result }}" == "failure" ]]; then
            echo "FAILED: Core tests failed - merge blocked"
            exit 1
          fi

          if [[ "${{ needs.selenium-e2e-tests.result }}" == "failure" ]]; then
            echo "WARNING: Selenium smoke tests failed - review required"
          