name: CareerConnect CI

on:
  push:
    branches: [main, integration-manager]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Backend (Node.js) Tests ─────────────────────────────────────────
  backend-tests:
    name: Backend Tests (Node.js)
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret' }}
      AI_SERVICE_URL: http://localhost:8000
      CLIENT_URL: http://localhost:3001
      GMAIL_USER: ${{ secrets.GMAIL_USER || 'ci-test@example.com' }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || 'ci-test-placeholder' }}
      MAIL_FROM: CareerConnect CI
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || 'ci-test-client-id' }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || 'ci-test-client-secret' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Run utility tests (no DB needed)
        run: npx jest tests/utils.test.js --runInBand --forceExit
        working-directory: server

      - name: Run auth & jobs tests (requires MongoDB)
        if: ${{ env.MONGODB_URI != '' }}
        run: npx jest tests/auth.test.js tests/jobs.test.js --runInBand --forceExit --testTimeout=30000
        working-directory: server
        continue-on-error: true
        working-directory: client

      - name: Run unit tests
        run: npm test
        working-directory: client

      - name: Build check
        run: npm run build
        working-directory: client
        env:
          VITE_API_BASE_URL: /api

  # ── Job 3: AI Service (Python) Tests ───────────────────────────────────────
  ai-tests:
    name: AI Service Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx
        working-directory: ai-service

      - name: Run AI service tests
        run: python -m pytest tests/ -v --tb=short
        working-directory: ai-service

  # ── Job 4: Final gate (core tests only — no Selenium) ──────────────────────
  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, ai-tests]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          echo "backend-tests:  ${{ needs.backend-tests.result }}"
          echo "frontend-tests: ${{ needs.frontend-tests.result }}"
          echo "ai-tests:       ${{ needs.ai-tests.result }}"

          if [[ "${{ needs.backend-tests.result }}" == "failure" || \
                "${{ needs.frontend-tests.result }}" == "failure" || \
                "${{ needs.ai-tests.result }}" == "failure" ]]; then
            echo "FAILED: One or more core test jobs failed"
            exit 1
          fi
          echo "PASSED: All core tests passed"

  # ── Job 5: Deploy to Staging (only on main after core tests pass) ───────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [all-tests-passed]
    if: github.ref == 'refs/heads/main' && success()
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify deployment start
        run: |
          echo "All tests passed on main branch."
          echo "Deploying to staging environment..."
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"

      # Add your actual deployment step here, e.g.:
      # - name: Deploy to Railway / Render / EC2
      #   run: ./scripts/deploy.sh staging

      - name: Deployment complete
        run: echo "Staging deployment complete"
