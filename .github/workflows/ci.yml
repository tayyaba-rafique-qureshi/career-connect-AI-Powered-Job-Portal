name: CareerConnect CI

on:
  push:
    branches: [main, integration-manager]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Backend (Node.js) Tests ─────────────────────────────────────────
  backend-tests:
    name: Backend Tests (Node.js)
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JWT_SECRET: test_jwt_secret_for_ci
      AI_SERVICE_URL: http://localhost:8000
      CLIENT_URL: http://localhost:3001
      GMAIL_USER: test@test.com
      GMAIL_APP_PASSWORD: testpassword
      MAIL_FROM: CareerConnect <test@test.com>
      GOOGLE_CLIENT_ID: test_client_id
      GOOGLE_CLIENT_SECRET: test_client_secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Run utility tests (no DB needed)
        run: npx jest tests/utils.test.js --runInBand --forceExit
        working-directory: server

      - name: Run auth & jobs tests (requires MongoDB)
        if: ${{ env.MONGODB_URI != '' }}
        run: npx jest tests/auth.test.js tests/jobs.test.js --runInBand --forceExit --testTimeout=30000
        working-directory: server

  # ── Job 2: Frontend (React/Vite) Tests ─────────────────────────────────────
  frontend-tests:
    name: Frontend Tests (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Run unit tests
        run: npm test
        working-directory: client

      - name: Build check
        run: npm run build
        working-directory: client
        env:
          VITE_API_BASE_URL: /api

  # ── Job 3: AI Service (Python) Tests ───────────────────────────────────────
  ai-tests:
    name: AI Service Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx
        working-directory: ai-service

      - name: Run AI service tests
        run: python -m pytest tests/ -v --tb=short
        working-directory: ai-service

  # ── Job 4: Integration summary ─────────────────────────────────────────────
  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, ai-tests]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-tests.result }}" == "failure" || \
                "${{ needs.frontend-tests.result }}" == "failure" || \
                "${{ needs.ai-tests.result }}" == "failure" ]]; then
            echo "❌ One or more test jobs failed"
            exit 1
          fi
          echo "✅ All tests passed"
