[pytest]
testpaths = tests/selenium/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --html=tests/selenium/reports/report.html
    --self-contained-html
    --reruns=2
    --reruns-delay=1
    --timeout=30
markers =
    smoke: Quick smoke tests (fastest subset)
    regression: Full regression suite
    auth: Authentication tests
    crud: CRUD operation tests
    admin: Admin panel tests
    applicant: Applicant journey tests
    recruiter: Recruiter journey tests
    slow: Tests that take more than 10 seconds
log_cli = true
log_cli_level = INFO
